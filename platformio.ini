; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env]
platform = espressif8266
framework = arduino
lib_deps = 
	sfeister/SCPI_Parser @ ^2.2.0
	emelianov/modbus-esp8266 @ ^4.1.0
	wnatth3/WiFiManager @ 2.0.16-rc.2
	full-stack-ex/TinyTemplateEngine@^1.1
build_flags = 
	-D DEFAULT_UART_BAUDRATE=9600
	-D USE_FULL_ERROR_LIST
extra_scripts = pre:scripts/get_version.py

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = partition_layout.csv
framework = arduino
lib_compat_mode = strict
lib_deps = 
	ayushsharma82/ElegantOTA
	ayushsharma82/WebSerial
	sfeister/SCPI_Parser @ ^2.2.0
	emelianov/modbus-esp8266 @ ^4.1.0
	full-stack-ex/TinyTemplateEngine@^1.1
monitor_speed = 115200
monitor_port = COM6
upload_port = COM6
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
	-DCORE_DEBUG_LEVEL=0
build_flags = 
	${env.build_flags}
    -D LED_BUILTIN=2
	-D MODBUS_RX=16
	-D MODBUS_TX=17
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D ELEGANTOTA_DEBUG=1
	-D UPDATE_DEBUG=1
	-D CONFIG_ARDUHAL_LOG_COLORS
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D ENABLE_RD_EN_DETECT
	-D RD_EN_PIN=5
board_build.filesystem = littlefs
check_skip_packages = yes

[env:nodemcuv2]
board = nodemcuv2
build_flags = 
	${env.build_flags}
	-D LED_BUILTIN=2
	-D MODBUS_USE_SOFWARE_SERIAL
	-D MODBUS_RX=D5
	-D MODBUS_TX=D6
	${sysenv.EXTRA_BUILD_FLAGS_nodemcuv2}
upload_port = ${sysenv.UPLOAD_PORT_nodemcuv2}
upload_resetmethod = nodemcu
upload_speed = 115200
monitor_port = ${sysenv.MONITOR_PORT_nodemcuv2}
monitor_speed = 74880
