; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
board_build.partitions = partition_layout.csv
board_build.filesystem = littlefs
framework = arduino
lib_compat_mode = strict
lib_deps = 
	ayushsharma82/ElegantOTA
	ayushsharma82/WebSerial
	sfeister/SCPI_Parser @ ^2.2.0
	emelianov/modbus-esp8266 @ ^4.1.0
	full-stack-ex/TinyTemplateEngine@^1.1
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_dtr = 0
monitor_rts = 0
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
	-D CORE_DEBUG_LEVEL=0
build_type = debug
build_flags = 
	${env.build_flags}
    -D LED_BUILTIN=4
	-D MODBUS_RX=5
	-D MODBUS_TX=17
    -D DEFAULT_UART_BAUDRATE=19200
    -D USE_FULL_ERROR_LIST
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D ELEGANTOTA_DEBUG=1
	-D UPDATE_DEBUG=1
	-D CONFIG_ARDUHAL_LOG_COLORS
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
extra_scripts =
    pre:scripts/get_version.py
	pre:scripts/get_build_time.py
	pre:scripts/upload_littlefs.py
    scripts/make_gz.py
check_skip_packages = yes
